# ============================================================
# ClipMind Release Workflow
# ============================================================
# 触发条件：推送 v* 格式的 tag
# 产出：
#   - Docker 部署文件（用户自行 build）
#   - Tauri 桌面安装包（Windows .msi/.nsis, macOS .dmg, Linux .deb）
#
# 优化：
#   - Rust/npm/pip 三级缓存
#   - Linux 只打 .deb（.rpm 打包极慢会导致超时）
#   - macOS-Intel 设为可选（runner 紧张时不阻塞发布）
# ============================================================

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            label: macOS-ARM
          - platform: macos-13
            args: ""
            label: macOS-Intel
          - platform: ubuntu-22.04
            args: "--bundles deb"
            label: Linux
          - platform: windows-latest
            args: ""
            label: Windows

    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.label == 'macOS-Intel' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.label }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend (static export)
        run: |
          cd frontend
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend (PyInstaller)
        run: pyinstaller packaging/clipmind-backend.spec --noconfirm

      - name: Setup Tauri resources
        shell: bash
        run: |
          set -e
          mkdir -p src-tauri/resources/clipmind-backend
          cp -r dist/clipmind-backend/* src-tauri/resources/clipmind-backend/

          mkdir -p src-tauri/resources/chromium
          export PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/src-tauri/resources/chromium"
          python -m playwright install chromium

          mkdir -p src-tauri/resources/data/models
          echo "Models are downloaded at runtime by the application." > src-tauri/resources/data/models/README.txt

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ClipMind ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: .

  publish-release-notes:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Note
        run: |
          echo "Docker deployment: users run 'docker compose up --build' from the release tag."
          echo "Tauri desktop builds: uploaded as release assets by build-tauri job."
