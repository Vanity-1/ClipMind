# ============================================================
# ClipMind Release Workflow
# ============================================================
# 触发条件：推送 v* 格式的 tag
# 产出：
#   - Docker 镜像（通过 Dockerfile，用户自行 build）
#   - Tauri 桌面安装包（Windows .msi/.exe, macOS .dmg, Linux .AppImage/.deb）
# ============================================================

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ============================================================
  # Job 1: 构建 Tauri 桌面安装包（三平台并行）
  # ============================================================
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64: macos-latest 是 Apple Silicon 原生
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            label: macOS-ARM
          # macOS Intel: macos-13 是 Intel 原生，避免 PyInstaller 交叉编译问题
          - platform: macos-13
            args: ""
            label: macOS-Intel
          - platform: ubuntu-22.04
            args: ""
            label: Linux
          - platform: windows-latest
            args: ""
            label: Windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macos-latest (ARM64) 需要交叉编译 target（Tauri build --target）
          # macos-13 (Intel) 原生 x86_64，无需额外 target
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend (static export)
        run: |
          cd frontend
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend (PyInstaller)
        run: pyinstaller packaging/clipmind-backend.spec --noconfirm

      - name: Setup Tauri resources
        shell: bash
        run: |
          set -e

          # 1. 复制 PyInstaller 后端产物
          mkdir -p src-tauri/resources/clipmind-backend
          cp -r dist/clipmind-backend/* src-tauri/resources/clipmind-backend/

          # 2. 安装 Chromium（Playwright，用于抖音扫码登录）
          #    直接安装到 resources/chromium，打包后由 lib.rs 设置 PLAYWRIGHT_BROWSERS_PATH
          mkdir -p src-tauri/resources/chromium
          export PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/src-tauri/resources/chromium"
          python -m playwright install chromium

          # 3. 安装 ffmpeg（视频处理）
          mkdir -p src-tauri/resources/ffmpeg
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -LsS https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -o /tmp/ffmpeg.zip
            unzip -o /tmp/ffmpeg.zip -d /tmp/ffmpeg-extract
            cp /tmp/ffmpeg-extract/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe src-tauri/resources/ffmpeg/
            rm -rf /tmp/ffmpeg.zip /tmp/ffmpeg-extract
          elif [ "$RUNNER_OS" = "Linux" ]; then
            curl -LsS https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux-amd64-gpl.tar.xz -o /tmp/ffmpeg.tar.xz
            mkdir -p /tmp/ffmpeg-extract
            tar xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extract --strip-components=1
            cp /tmp/ffmpeg-extract/bin/ffmpeg src-tauri/resources/ffmpeg/
            rm -rf /tmp/ffmpeg.tar.xz /tmp/ffmpeg-extract
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
            cp "$(which ffmpeg)" src-tauri/resources/ffmpeg/
          fi

          # 4. 模型目录占位（应用运行时自动下载）
          mkdir -p src-tauri/resources/data/models
          echo "Models are downloaded at runtime by the application." > src-tauri/resources/data/models/README.txt

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ClipMind ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: .

  # ============================================================
  # Job 2: 发布 Docker 部署说明（不构建镜像，用户自行 build）
  # ============================================================
  publish-release-notes:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Note
        run: |
          echo "Docker deployment: users run 'docker compose up --build' from the release tag."
          echo "Tauri desktop builds: uploaded as release assets by build-tauri job."
