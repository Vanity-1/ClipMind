# ============================================================
# ClipMind Docker Compose 一键部署
# ============================================================
# 使用方法：
#   1. cp .env.example .env  （编辑配置）
#   2. docker compose up --build
#
# 访问地址：
#   前端：http://localhost:3000
#   后端：http://localhost:8000/docs
# ============================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clipmind-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - APP_HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: clipmind-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped